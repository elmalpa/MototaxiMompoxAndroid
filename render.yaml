services:
  - type: web
    name: mototaxi-mompox-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: JWT_SECRET
        generateValue: true
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SERVER
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_PORT
        value: "1433"
      - key: DB_ENCRYPT
        value: "true"
      - key: DB_TRUST_CERT
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: SMS_PROVIDER
        value: smsgate
      - key: SMSGATE_URL
        value: https://api.sms-gate.app/3rdparty/v1
      - key: SMSGATE_USERNAME
        sync: false
      - key: SMSGATE_PASSWORD
        sync: false
      - key: SMSGATE_DEVICE_ID
        sync: false
      - key: SMSGATE_SIM_NUMBER
        sync: false
